# tmux-sessionizer config (OPTIONAL)
# On any machine, tmux-sessionizer automatically discovers existing standard project folders:
# ~/projects, ~/code, ~/dev, ~/src, ~/repos, ~/work, ~/workspace, ~/personal, ~/.config,
# as well as zoxide entries, ghq repositories, and active tmux sessions.
#
# Use this file ONLY if you want to add machine-specific paths or adjust depths.

# Extra custom directories to search (depth 1):
# TS_SEARCH_PATHS=(
#     ~/custom_folder
# )

# Extra paths with custom search depth (path:depth):
# TS_EXTRA_SEARCH_PATHS=(
#     ~/ghq:3
#     ~/.config:2
# )

# Default search depth for TS_SEARCH_PATHS (default: 1)
# TS_MAX_DEPTH=1
